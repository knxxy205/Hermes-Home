name: Verify Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check production credential literals
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_no_embedded_credentials.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test, lint, and build debug APK
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
      - name: Upload CI test APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-home-ci-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-home-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7
