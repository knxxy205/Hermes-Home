name: Build and Publish Beta APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')

          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Could not detect active Java major version." >&2
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR_VERSION"

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR_VERSION) is lower than required Java 17." >&2
            exit 1
          fi

          echo "Java environment confirmed: Java $JAVA_MAJOR_VERSION is active (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing file."
          else
            echo "./debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/homeserver.jks
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$DEBUG_KEYSTORE_PATH"
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file '$EXPECTED_APK' was not found." >&2
            echo "Searching discovered APK paths under app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file '$EXPECTED_APK' exists but is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: File '$EXPECTED_APK' does not have a .apk extension." >&2
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is '$EXPECTED_APK' instead of exact expected path 'app/build/outputs/apk/debug/app-debug.apk'." >&2
            exit 1
          fi

          echo "Verified debug APK successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"

          TEMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION"
          RELEASE_FILENAME="${CLEAN_REPO_NAME}-v${APP_VERSION}-beta.${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"

          cp "$VERIFIED_APK" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "Error: Failed to copy or verify prepared release asset at '$TARGET_ASSET_PATH'." >&2
            exit 1
          fi

          RELEASE_TAG="v${APP_VERSION}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Hermes Home v${APP_VERSION} — Beta"

          echo "asset_path=${TARGET_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          echo "Release asset prepared: $TARGET_ASSET_PATH"
          echo "Release filename: $RELEASE_FILENAME"
          echo "Release tag: $RELEASE_TAG"
          echo "Release title: $RELEASE_TITLE"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_asset.outputs.release_title }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset '$ASSET_PATH' does not exist." >&2
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset '$ASSET_PATH' is empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Asset '$ASSET_PATH' does not have a .apk extension." >&2
              exit 1
              ;;
          esac

          RELEASE_NOTES_FILE="${RUNNER_TEMP}/hermes-home-release-notes.md"
          cat > "$RELEASE_NOTES_FILE" <<EOF
          Manage your homeserver from Android with an SSH terminal, SFTP files, and self-hosted Hermes chat.

          ### Download
          **[Download the Android APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME})**

          Requires Android 7.0 or later and network access to your own SSH server. Hermes chat requires a compatible endpoint.

          ### Included
          - Interactive SSH terminal and connection profiles.
          - File browsing, multi-select, recursive search, and file information.
          - Downloads to a folder you choose and background uploads.
          - Self-hosted Hermes chat and encrypted local settings.

          [Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md) · [Setup guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md)

          ### Installation
          Open the APK on your Android device and allow installation from that source when prompted. Updates use the persistent Hermes Home testing key.

          This beta is a debug APK for testing. It is not a production or Play Store release. Folder downloads and automatic download resume are not supported yet.

          <details>
          <summary>Source and verification</summary>

          Built and tested by GitHub Actions. APK checksums are available in SHA256SUMS.txt.

          [Matching source archive](https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.zip) · [Build details](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          </details>
          EOF

          CHECKSUM_FILE="$(dirname "$ASSET_PATH")/SHA256SUMS.txt"
          (cd "$(dirname "$ASSET_PATH")" && sha256sum "$ASSET_NAME") > "$CHECKSUM_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" "$CHECKSUM_FILE" \
             --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES_FILE" \
             --target "$GITHUB_SHA" \
            --prerelease

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_asset.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          echo "=== APK Download and Release Report ==="

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release successfully published!"
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Built and Published to GitHub Releases"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: $RELEASE_TITLE"
              echo "- **APK Filename**: \`$ASSET_NAME\`"
              echo "- **Direct Download**: Download directly on your phone from the [GitHub Release Page]($RELEASE_URL) under the **Assets** section."
              echo "- **Actions Artifact**: The standard artifact \`app-debug-apk\` is also stored on the workflow run page as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete, but the debug APK build and artifact upload succeeded."
            echo "The debug APK artifact 'app-debug-apk' remains safely uploaded in GitHub Actions."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "- **Build Status**: The debug APK was compiled, verified, and uploaded successfully."
              echo "- **Actions Artifact Available**: Download the APK as the \`app-debug-apk\` artifact from this workflow run's Summary page."
              echo "- **Release Publishing**: Release creation was skipped or encountered an error, but no build outputs were lost."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
